[project]
name = "qa-platform-server"
version = "0.1.0"
description = "Postgres-backed REST API for qa-platform (FastAPI + SQLModel + asyncpg)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-socketio[asyncio-client]>=5.11",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "bcrypt>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]
