# 前端容器的 nginx:托管 SPA 静态文件 + 反代后端 API。
# 前端用同源相对路径访问 /v1 /admin /health,这里转发到 server:18791。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源与 SPA 路由回退(刷新 /skills、/reports/:id 等不 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST API
    location /v1/ {
        proxy_pass http://server:18791;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE(platform 聊天 /v1/platform/chat 是流式)──
        # 必须关闭缓冲、保持长连接,否则前端收不到逐字流、或被超时切断。
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 一次性迁移等管理接口
    location /admin/ {
        proxy_pass http://server:18791;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查
    location = /health {
        proxy_pass http://server:18791;
    }

    # 上传/长 prompt 兜底:放宽请求体大小
    client_max_body_size 25m;
}
